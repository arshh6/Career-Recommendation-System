<!DOCTYPE html>
<html>
<head>

    <title>Career Prediction System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>

        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }

        .container{
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            padding:50px;
            border-radius:15px;
            text-align:center;
            width:500px;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
        }

        h1{
            color:white;
            font-size:40px;
            margin-bottom:20px;
        }

        p{
            color:#f1f1f1;
            font-size:18px;
            margin-bottom:35px;
        }

        .btn{
            display:inline-block;
            padding:15px 35px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color:white;
            text-decoration:none;
            font-size:20px;
            border-radius:8px;
            transition:0.3s;
        }

        .btn:hover{
            background:#0056b3;
            transform:scale(1.05);
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Career Prediction System</h1>

        <p>
            Discover the best career path based on your interests,
            skills, and technical preferences using Machine Learning.
        </p>

        <a href="/quiz" class="btn">Start Quiz</a>

    
    </div>

</body>
</html>
